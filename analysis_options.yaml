include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Warnings and lints fail `flutter analyze` / CI, not just infos.
    todo: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/core/l10n_gen/**"
    # One-off developer diagnostics (puzzle-generation calibration scripts),
    # not shipped app code — not held to the same lint bar.
    - "tool/**"

linter:
  rules:
    # Riverpod generator + Isar generator produce part files that violate
    # this; the rule adds no value in this codebase.
    public_member_api_docs: false
    # Locked target is Android API 24+ / iOS 13+ (Dart VM/AOT) only — no
    # web/dart2js target is planned, so JS-safe-integer literals don't
    # apply. Needed for the puzzle engine's hashing/PRNG constants.
    avoid_js_rounded_ints: false
    # Phase 0 architecture rule: every services/* capability sits behind
    # an abstract interface, even a single-method one — that's what makes
    # it fakeable in tests and disableable in debug builds. Not a mistake
    # to flag.
    one_member_abstracts: false
