name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.5

      - name: Install dependencies
        run: flutter pub get

      # Generated code (.g.dart, l10n) is gitignored — see CLAUDE.MD's
      # "no hardcoded strings" / codegen notes — so CI has to produce it
      # itself before analyze/test can even compile.
      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate Riverpod/Isar code
        run: dart run build_runner build --delete-conflicting-outputs

      # Isar-backed tests load the native library directly rather than
      # through Flutter's plugin asset pipeline — see tool/test_setup.dart
      # and CLAUDE.MD's Phase 3 deviations.
      - name: Set up Isar native library for tests
        run: dart run tool/test_setup.dart

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test
